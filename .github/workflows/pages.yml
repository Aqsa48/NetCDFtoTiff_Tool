name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'LICENSE'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Verify and package converter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install ".[test]"
      - name: Verify Python and browser conversion
        run: |
          python -m pytest -q
          node web/test-core.mjs
          python web/verify_browser_output.py
      - name: Prepare public files
        run: |
          mkdir -p _site
          cp web/index.html web/style.css web/app.mjs web/core.mjs web/netcdfjs.mjs web/sample.nc web/THIRD_PARTY_NOTICES.md _site/
          cp LICENSE _site/LICENSE
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publish converter
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages configuration
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
